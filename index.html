<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Таможенный калькулятор · валюта на выбор</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
if(typeof XLSX==='undefined'){
  document.write('<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
}
</script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f6f9;padding:14px;font-size:13px;color:#222;margin:0}
h1{font-size:18px;margin:0 0 12px}
h2{font-size:14px;color:#1a56a0;margin:0 0 10px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:11px;color:#666;margin-bottom:3px}
select,input{width:100%;padding:7px;border:1px solid #ccd3dd;border-radius:6px;font-size:13px;font-family:inherit}
select:focus,input:focus{outline:2px solid #1a56a0;border-color:#1a56a0}
button{background:#1a56a0;color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:13px;cursor:pointer;margin-top:10px}
button:hover{background:#0d3d75}
button.sec{background:#fff;color:#1a56a0;border:1px solid #1a56a0}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{background:#1a56a0;color:#fff;padding:6px;font-size:11px;text-align:left}
td{padding:5px 6px;border-bottom:1px solid #e3e7ee;font-size:12px}
td.num{text-align:right;font-family:monospace}
.warn{background:#fff3f3;border:1px solid #e0b4b4;border-radius:6px;padding:8px;font-size:12px;color:#a33;margin-top:8px}
.ok{background:#eef9ee;border:1px solid #b7d8b7;border-radius:6px;padding:8px;font-size:12px;color:#2a7a2a;margin-top:8px}
.info{background:#f0f6ff;border:1px solid #b7cdf0;border-radius:6px;padding:8px;font-size:12px;color:#255;margin-top:8px}
.tot{background:#eaf3ff;padding:10px;border-radius:8px;margin-top:10px;font-size:15px;display:flex;justify-content:space-between;font-weight:600}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e7ee}
.row b{font-family:monospace}
.hint{font-size:11px;color:#888;margin-top:6px}
.cur-tag{display:inline-block;background:#1a56a0;color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;margin-left:6px}
</style>
</head>
<body>

<h1>🌸 Таможенный калькулятор</h1>

<div class="card">
<h2>1. Валюта и курсы</h2>
<div class="grid">
  <div><label>Валюта инвойса</label>
    <select id="cur" onchange="syncCur()">
      <option value="CNY">CNY · юань</option>
      <option value="USD">USD · доллар</option>
      <option value="EUR">EUR · евро</option>
    </select>
  </div>
  <div><label>Валюта расчёта (в ней вывод)</label>
    <select id="base" onchange="syncCur()">
      <option value="USD">USD · доллар</option>
      <option value="EUR">EUR · евро</option>
      <option value="CNY">CNY · юань</option>
    </select>
  </div>
  <div><label id="lbl1">1 CNY =</label><input type="number" id="r1" value="0.1405" step="0.0001" oninput="calcRates()"></div>
  <div><label id="lbl2">1 EUR =</label><input type="number" id="r2" value="1.0800" step="0.0001" oninput="calcRates()"></div>
  <div><label>Курс USD→<span id="lbl3">USD</span></label><input type="number" id="r3" value="1" readonly style="background:#f0f2f5"></div>
</div>
<div id="rateInfo" class="info" style="margin-top:10px"></div>
</div>

<div class="card">
<h2>2. Данные инвойса</h2>
<div class="grid">
  <div><label>Источник</label>
    <select id="src" onchange="toggleSrc()">
      <option value="manual">Ввести вручную</option>
      <option value="file">Загрузить Excel / CSV</option>
    </select>
  </div>
  <div><label>Incoterms</label>
    <select id="incoterm">
      <option>FOB</option><option>EXW</option><option>CFR</option>
      <option>CIF</option><option>DAP</option><option>DDP</option>
    </select>
  </div>
  <div><label>Пошлина, %</label><input type="number" id="duty" value="5" step="0.1"></div>
  <div><label>Сбор, %</label><input type="number" id="fee" value="0.4" step="0.01"></div>
  <div><label>НДС, %</label><input type="number" id="vat" value="12" step="0.1"></div>
  <div><label>Транспорт (в валюте инвойса)</label><input type="number" id="trans" value="0" min="0"></div>
</div>
<div id="fileBox" style="display:none;margin-top:10px">
  <input type="file" id="file" accept=".xlsx,.xls,.csv">
  <div id="sheets" style="margin-top:8px;display:none">
    <label>Лист</label><select id="sheetSel" onchange="loadSheet()"></select>
  </div>
</div>
<div id="msg"></div>
<button onclick="run()">Рассчитать</button>
<button class="sec" onclick="fillDemo()">Пример</button>
</div>

<div class="card" id="outCard" style="display:none">
<h2>3. Результат <span class="cur-tag" id="curTag"></span></h2>
<div id="out"></div>
</div>

<script>
/* ===== СПРАВОЧНИК КОДОВ ===== */
const REF={
'0603110000':{n:'Розы',pct:5,min:0.30},
'0603120000':{n:'Гвоздики',pct:5,min:0.30},
'0603130000':{n:'Орхидеи',pct:5,min:0.30},
'0603140000':{n:'Хризантемы',pct:5,min:0.30},
'0603150000':{n:'Лилии',pct:5,min:0.30},
'0603191000':{n:'Гладиолусы',pct:5,min:0.30},
'0603197000':{n:'Прочие срезанные цветы',pct:5,min:0.30},
'0603900000':{n:'Сухоцветы',pct:7.5,min:0.45},
'0604209000':{n:'Зелень декоративная',pct:5,min:0.30},
'0601203000':{n:'Фаленопсис горшечной',pct:5,min:0},
'0602909900':{n:'Растения прочие (суккуленты)',pct:5,min:0}
};

let rows=[], wb=null;

/* ===== КУРСЫ ===== */
// r1: 1 CNY -> USD ; r2: 1 EUR -> USD ; r3: 1 base -> base (всегда 1)
function rates(){
  const cnyUsd=+document.getElementById('r1').value||0.1405;
  const eurUsd=+document.getElementById('r2').value||1.08;
  const base=document.getElementById('base').value;
  const baseUsd=base==='CNY'?cnyUsd:base==='EUR'?eurUsd:1;
  return {cnyUsd,eurUsd,base,baseUsd};
}
// перевод из валюты v в валюту base
function conv(v,from,to){
  const R=rates();
  const toUsd=x=>from==='CNY'?x*R.cnyUsd:from==='EUR'?x*R.eurUsd:x;
  const usd=toUsd(v);
  return to==='CNY'?usd/R.cnyUsd:to==='EUR'?usd/R.eurUsd:usd;
}
function money(v){ return v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function syncCur(){
  const cur=document.getElementById('cur').value;
  const base=document.getElementById('base').value;
  document.getElementById('lbl1').textContent='1 CNY = (USD)';
  document.getElementById('lbl2').textContent='1 EUR = (USD)';
  document.getElementById('lbl3').textContent=base;
  document.getElementById('r3').value=1;
  document.getElementById('rateInfo').innerHTML=
    `Инвойс в <b>${cur}</b> → расчёт в <b>${base}</b>. `+
    `Курс: 1 ${cur} = ${money(conv(1,cur,base))} ${base}. `+
    (cur===base?'Совпадают — пересчёта нет.':'Пересчёт выполнен автоматически.');
  if(rows.length) run();
}
function calcRates(){
  document.getElementById('r3').value=1;
  if(rows.length) run();
}

/* ===== ФАЙЛ ===== */
function toggleSrc(){
  document.getElementById('fileBox').style.display=
    document.getElementById('src').value==='file'?'block':'none';
}
function num(s){
  if(s==null||s==='') return 0;
  if(typeof s==='number') return s;
  s=String(s).replace(/[\s\u00A0\u2009\u202F]/g,'').replace(',','.');
  const v=parseFloat(s); return isNaN(v)?0:v;
}
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  if(typeof XLSX==='undefined'){
    document.getElementById('msg').innerHTML='<div class="warn">Библиотека Excel не загрузилась. Используйте ввод вручную или CSV.</div>';
    return;
  }
  const r=new FileReader();
  r.onload=ev=>{
    try{
      wb=XLSX.read(ev.target.result,{type:'array'});
      const sel=document.getElementById('sheetSel');
      sel.innerHTML=wb.SheetNames.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
      document.getElementById('sheets').style.display=wb.SheetNames.length>1?'block':'none';
      loadSheet();
    }catch(err){ document.getElementById('msg').innerHTML='<div class="warn">'+err.message+'</div>'; }
  };
  r.readAsArrayBuffer(f);
});
function loadSheet(){
  const ws=wb.Sheets[wb.SheetNames[+document.getElementById('sheetSel').value]];
  parse(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
}
function parse(aoa){
  const lines=(aoa||[]).map(r=>Array.isArray(r)?r.map(c=>c==null?'':String(c)):[]);
  if(!lines.length){ document.getElementById('msg').innerHTML='<div class="warn">Файл пустой.</div>'; return; }
  let hEnd=0;
  for(let i=0;i<lines.length;i++){
    const hasText=lines[i].some(c=>c.trim().length>0);
    const hasNum=lines[i].some(c=>num(c)>0);
    if(hasText&&!hasNum) hEnd=i;
    if(hasNum) break;
  }
  const header=[];
  for(let i=0;i<=hEnd;i++) (lines[i]||[]).forEach((c,j)=>{
    const t=String(c).replace(/["\s]/g,''); if(t&&!header[j]) header[j]=t;
  });
  for(let j=0;j<60;j++) if(!header[j]) header[j]='';
  const find=(...k)=>header.findIndex(h=>k.some(x=>String(h).includes(x)));
  const iN=find('товар','наимен','品名','NAME'), iQ=find('数量','QTY','кол-во'),
        iC=find('币别','CURRENCY','валют'), iP=find('单价','UNIT PRICE','цена'),
        iS=find('总金额','TOTAL','VALUE','金额','сумм'),
        iNet=find('净重','N.WEIGHT','нетто'), iG=find('毛重','G.WEIGHT','брутто');
  rows=[]; let cur='';
  lines.slice(hEnd+1).forEach(c=>{
    if(!Array.isArray(c)) return;
    const sum=num(c[iS]); if(!sum) return;
    let cc=(iC>=0?c[iC]:'')||'';
    if(/CNY|人民币|¥/i.test(cc)) cc='CNY';
    else if(/USD|\$/i.test(cc)) cc='USD';
    else if(/EUR|€/i.test(cc)) cc='EUR';
    if(cc) cur=cc;
    rows.push({name:String(c[iN]||'').replace(/["\s]+$/,''),qty:num(c[iQ]),price:num(c[iP]),
      sum,net:num(c[iNet]),gross:num(c[iG]),cur:cc,code:guessCode(String(c[iN]||''))});
  });
  if(!cur) cur=/CNY|人民币|¥/.test(lines.join(' '))?'CNY':'USD';
  document.getElementById('cur').value=cur;
  syncCur();
  document.getElementById('msg').innerHTML=rows.length
    ? `<div class="ok">Загружено позиций: ${rows.length}. Валюта: <b>${cur}</b>.</div>`
    : `<div class="warn">Суммы не найдены. Заголовки: ${header.filter(Boolean).join(' | ')}</div>`;
  if(rows.length) run();
}
function guessCode(name){
  const s=name.toLowerCase();
  if(/роз|玫瑰/.test(s)&&!/горш|盆栽/.test(s)) return '0603110000';
  if(/гвозд|康乃馨/.test(s)) return '0603120000';
  if(/хризантем|菊花/.test(s)) return '0603140000';
  if(/орхид|兰花|фаленопсис/.test(s)) return /горш|盆栽/.test(s)?'0601203000':'0603130000';
  if(/лилия|百合/.test(s)) return '0603150000';
  if(/гладиол|剑兰/.test(s)) return '0603191000';
  if(/сухоцвет|干花/.test(s)) return '0603900000';
  if(/зелень|эвкалипт|装饰叶/.test(s)) return '0604209000';
  if(/суккулент|горш/.test(s)) return '0602909900';
  return '0603197000';
}

/* ===== РАСЧЁТ ===== */
function fillDemo(){
  rows=[
    {name:'Роза',qty:14000,price:2.16,sum:30187.18,net:785,gross:982,cur:'CNY',code:'0603110000'},
    {name:'Гвоздика',qty:26720,price:0.96,sum:25550.48,net:998,gross:1248,cur:'CNY',code:'0603120000'},
    {name:'Хризантема',qty:19000,price:4.06,sum:77061.48,net:1426,gross:1782,cur:'CNY',code:'0603140000'}
  ];
  document.getElementById('cur').value='CNY';
  document.getElementById('base').value='USD';
  syncCur();
}

function run(){
  if(!rows.length){ document.getElementById('outCard').style.display='none'; return; }
  const cur=document.getElementById('cur').value;
  const base=document.getElementById('base').value;
  const dPct=+document.getElementById('duty').value||0;
  const fPct=+document.getElementById('fee').value||0;
  const vPct=+document.getElementById('vat').value||0;
  const inc=document.getElementById('incoterm').value;
  const trans=+document.getElementById('trans').value||0;
  const addLog=(inc==='EXW'||inc==='FOB'||inc==='CFR')?trans:0;

  let tInv=0;
  rows.forEach(r=>tInv+=r.sum);
  const transInv=addLog;

  let html=`<table><tr><th>Товар</th><th>Код</th><th>Кол-во</th>
    <th>Сумма (${cur})</th><th>База (${cur})</th><th>Нетто кг</th>
    <th>Пошлина (${base})</th></tr>`;

  // итоги считаем отдельными переменными — вне цикла
  let sumDutyBase=0, sumFeeBase=0;

  rows.forEach(r=>{
    const share=tInv?r.sum/tInv:0;
    const baseRow=r.sum+transInv*share;
    const ref=REF[r.code]||{pct:dPct,min:0};
    const adval=baseRow*ref.pct/100;
    const specCur=conv(ref.min*r.net,'EUR',cur);
    const dutyCur=Math.max(adval,specCur);
    const dutyBaseRow=conv(dutyCur,cur,base);
    const feeBaseRow=conv(r.sum*fPct/100,cur,base);
    sumDutyBase+=dutyBaseRow;
    sumFeeBase+=feeBaseRow;
    html+=`<tr><td>${r.name}</td><td>${r.code}</td>
      <td class="num">${r.qty.toLocaleString()}</td>
      <td class="num">${money(r.sum)}</td><td class="num">${money(baseRow)}</td>
      <td class="num">${r.net.toLocaleString()}</td>
      <td class="num">${money(dutyBaseRow)}</td></tr>`;
  });
  html+='</table>';

  const invBase=conv(tInv,cur,base);
  const feeBase=sumFeeBase;
  const dutyBase=sumDutyBase;
  const vatBase=(invBase+dutyBase+feeBase)*vPct/100;
  const total=invBase+dutyBase+feeBase+vatBase;

  html+=`<div style="margin-top:12px">
    <div class="row"><span>Инвойс</span><b>${money(invBase)} ${base}</b></div>
    <div class="row"><span>Пошлина (по кодам ТН ВЭД)</span><b>${money(dutyBase)} ${base}</b></div>
    <div class="row"><span>Сбор ${fPct}%</span><b>${money(feeBase)} ${base}</b></div>
    <div class="row"><span>НДС ${vPct}%</span><b>${money(vatBase)} ${base}</b></div>
    <div class="tot"><span>ИТОГО к оплате</span><span>${money(total)} ${base}</span></div>
  </div>`;

  const warn=[];
  rows.forEach(r=>{
    if(r.net&&r.gross&&r.net>r.gross) warn.push(`${r.name}: нетто ${r.net} > брутто ${r.gross}`);
    if(r.price&&r.qty&&Math.abs(r.price*r.qty-r.sum)>1)
      warn.push(`${r.name}: цена×кол-во = ${money(r.price*r.qty)}, в инвойсе ${money(r.sum)}`);
  });
  if(warn.length) html+=`<div class="warn">${warn.join('<br>')}</div>`;
  if(addLog>0) html+=`<div class="info">Транспорт ${money(addLog)} ${cur} включён в базу (${inc}).</div>`;

  document.getElementById('curTag').textContent=base;
  document.getElementById('out').innerHTML=html;
  document.getElementById('outCard').style.display='block';
}
  const cur=document.getElementById('cur').value;
  const base=document.getElementById('base').value;
  const dPct=+document.getElementById('duty').value||0;
  const fPct=+document.getElementById('fee').value||0;
  const vPct=+document.getElementById('vat').value||0;
  const inc=document.getElementById('incoterm').value;
  const trans=+document.getElementById('trans').value||0;
  const addLog=(inc==='EXW'||inc==='FOB'||inc==='CFR')?trans:0;

  // всё переводим в валюту инвойса -> считаем -> в base
  let tInv=0;
  rows.forEach(r=>tInv+=r.sum);
  const transInv=addLog;

  let html=`<table><tr><th>Товар</th><th>Код</th><th>Кол-во</th>
    <th>Сумма (${cur})</th><th>База (${cur})</th><th>Нетто кг</th>
    <th>Пошлина (${base})</th></tr>`;
  let tDuty=0,tFee=0;
  rows.forEach(r=>{
    const share=tInv?r.sum/tInv:0;
    const baseRow=r.sum+transInv*share;
    const ref=REF[r.code]||{pct:dPct,min:0};
    const adval=baseRow*ref.pct/100;
    const spec=ref.min*r.net;               // €/кг -> пересчёт в валюту инвойса
    const specCur=conv(spec,'EUR',cur);
    const dutyCur=Math.max(adval,specCur);
    const dutyBase=conv(dutyCur,cur,base);
    tDuty+=dutyBase;
    tFee+=conv(r.sum*fPct/100,cur,base);
    html+=`<tr><td>${r.name}</td><td>${r.code}</td>
      <td class="num">${r.qty.toLocaleString()}</td>
      <td class="num">${money(r.sum)}</td><td class="num">${money(baseRow)}</td>
      <td class="num">${r.net.toLocaleString()}</td>
      <td class="num">${money(dutyBase)}</td></tr>`;
  });
  html+='</table>';

  const invBase=conv(tInv,cur,base);
  const feeBase=tFee;
  const vatBase=(invBase+dutyBase+feeBase)*vPct/100;
  const total=invBase+dutyBase+feeBase+vatBase;

  html+=`<div style="margin-top:12px">
    <div class="row"><span>Инвойс</span><b>${money(invBase)} ${base}</b></div>
    <div class="row"><span>Пошлина (по кодам ТН ВЭД)</span><b>${money(dutyBase)} ${base}</b></div>
    <div class="row"><span>Сбор ${fPct}%</span><b>${money(feeBase)} ${base}</b></div>
    <div class="row"><span>НДС ${vPct}%</span><b>${money(vatBase)} ${base}</b></div>
    <div class="tot"><span>ИТОГО к оплате</span><span>${money(total)} ${base}</span></div>
  </div>`;

  const warn=[];
  rows.forEach(r=>{
    if(r.net&&r.gross&&r.net>r.gross) warn.push(`${r.name}: нетто ${r.net} > брутто ${r.gross}`);
    if(r.price&&r.qty&&Math.abs(r.price*r.qty-r.sum)>1)
      warn.push(`${r.name}: цена×кол-во = ${money(r.price*r.qty)}, в инвойсе ${money(r.sum)}`);
  });
  if(warn.length) html+=`<div class="warn">${warn.join('<br>')}</div>`;
  if(addLog>0) html+=`<div class="info">Транспорт ${money(addLog)} ${cur} включён в базу (${inc}).</div>`;

  document.getElementById('curTag').textContent=base;
  document.getElementById('out').innerHTML=html;
  document.getElementById('outCard').style.display='block';
}

syncCur();
</script>
</body>
</html>
